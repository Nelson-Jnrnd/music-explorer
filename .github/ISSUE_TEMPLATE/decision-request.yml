name: Decision request
description: Material owner-reserved or approved-contract change
title: "DECISION: "
labels: ["type:decision"]
body:
  - type: textarea
    id: question
    attributes:
      label: Decision in plain language
      description: Explain what changes for users or the project
    validations:
      required: true
  - type: textarea
    id: reason
    attributes:
      label: Why this needs owner approval
    validations:
      required: true
  - type: textarea
    id: options
    attributes:
      label: Options and practical trade-offs
      description: A/B, optional C; use Approve/Reject if there is only one responsible proposal
    validations:
      required: true
  - type: textarea
    id: recommendation
    attributes:
      label: Recommendation (not approval)
    validations:
      required: true
  - type: textarea
    id: impact
    attributes:
      label: Affected issues, artifacts, interfaces and tests
    validations:
      required: true
