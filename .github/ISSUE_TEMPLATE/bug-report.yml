name: Defect
description: Reproducible defect with expected behavior and impact
title: "BUG: "
labels: ["type:bug"]
body:
  - type: textarea
    id: observed
    attributes:
      label: Observed behavior
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior and source of expectation
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction steps, versions, logs and evidence
    validations:
      required: true
  - type: textarea
    id: impact
    attributes:
      label: Impact, scope and workaround
    validations:
      required: true
